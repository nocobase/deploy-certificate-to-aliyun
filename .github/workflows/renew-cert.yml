name: Renew Aliyun CDN certificates

on:
  schedule:
    # Every Monday 01:23 UTC (09:23 Asia/Shanghai). Only domains expiring within RENEW_BEFORE_DAYS are renewed.
    - cron: '23 1 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Renew every domain regardless of expiry
        type: boolean
        default: false
      dry_run:
        description: Only check expiry, do not issue or deploy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renew-cdn-certificates
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Re-enabling the workflow keeps GitHub from disabling the schedule after 60 days without repository activity.
      actions: write
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install acme.sh
        if: ${{ !inputs.dry_run }}
        env:
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          curl -fsSL https://get.acme.sh | sh -s ${EMAIL:+email="$EMAIL"}
          # get.acme.sh exits 0 even when the install fails.
          test -x ~/.acme.sh/acme.sh

      - name: Check and renew certificates
        id: renew
        env:
          CDN_DOMAINS: ${{ vars.CDN_DOMAINS }}
          RENEW_BEFORE_DAYS: ${{ vars.RENEW_BEFORE_DAYS }}
          ALIYUN_CERT_REGION: ${{ vars.ALIYUN_CERT_REGION }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python renew.py

      - name: Clean up certificates
        if: always()
        run: rm -rf ~/certs ~/.acme.sh

      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${REPOSITORY}/actions/workflows/renew-cert.yml/enable"

      - name: Notify renewal
        if: success() && steps.renew.outputs.renewed != '0' && env.FEISHU_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ env.FEISHU_WEBHOOK_URL }}
          TITLE: 阿里云 CDN 证书已续期
          STATUS: success
          STATUS_TEXT_SUCCESS: 续期成功
          TABLE_JSON: ${{ steps.renew.outputs.rows }}
          CONTENT: 已签发新的 Let's Encrypt 证书并部署到 **${{ steps.renew.outputs.renewed }}** 个 CDN 域名，CDN 全网生效通常需要几分钟。
        run: ./scripts/feishu-notify.sh

      # Scheduled runs with nothing to renew stay silent; manual runs always report.
      - name: Notify check result
        if: success() && steps.renew.outputs.renewed == '0' && github.event_name == 'workflow_dispatch' && env.FEISHU_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ env.FEISHU_WEBHOOK_URL }}
          TITLE: 阿里云 CDN 证书检查完成
          STATUS: success
          STATUS_TEXT_SUCCESS: ${{ inputs.dry_run && '检查完成（dry run）' || '无需续期' }}
          TABLE_JSON: ${{ steps.renew.outputs.rows }}
          CONTENT: 各 CDN 域名当前证书状态：
        run: ./scripts/feishu-notify.sh

      - name: Notify failure
        if: failure() && env.FEISHU_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ env.FEISHU_WEBHOOK_URL }}
          TITLE: 阿里云 CDN 证书续期失败
          STATUS: failure
          STATUS_TEXT_FAILURE: 需要人工处理
          TABLE_JSON: ${{ steps.renew.outputs.rows }}
          CONTENT: 证书续期流程失败，请查看运行日志。未续期成功的域名会在下次定时运行时重试。
        run: ./scripts/feishu-notify.sh
